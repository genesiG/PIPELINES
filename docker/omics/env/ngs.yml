name: ngs
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # alignment / NGS tools
  - python=3.12.13
  - bowtie2=2.5.5
  - hisat2=2.2.1
  - samtools=1.23
  - htslib=1.23
  - sambamba=1.0.1
  - bedtools=2.31.1
  - bedops=2.4.42
  - picard=2.27.5
  - preseq=2.0.2
  - trimmomatic=0.40
  - subread=2.1.1
  - ucsc-bedgraphtobigwig=482
  - ucsc-bigwigtobedgraph=482
  - seacr=1.3
  - seqkit=2.13.0
  - openjdk
  # QC (formerly env qc)
  - fastqc=0.12.1
  - multiqc=1.35
  - cutadapt=5.2
  # deepTools, MACS3, pyGenomeTracks (formerly env ngspy)
  - deeptools=3.5.6
  - pygenometracks=3.9
  - macs3=3.0.4
