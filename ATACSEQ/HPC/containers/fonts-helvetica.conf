<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- omics image: Helvetica and Arial -> URW Nimbus Sans (metric-compatible), instead of DejaVu Sans -->
  <alias binding="same"><family>Helvetica</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Nimbus Sans</family></prefer></alias>
</fontconfig>
