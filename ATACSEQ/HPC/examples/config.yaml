# Generic config template for this pipeline (paired-end ATAC-seq). Copied to ./config.yaml by `run_atacseq.sh init`.
# Copy of examples/projects/av_atacseq_2026/config.yaml with the project paths removed. Every line marked `# set me` must be filled in.
# Reference paths are taken from AV_ATACSEQ_2026/Scripts/config.py (SPECIES = t2t), except the TSS path (see below).
#
# ---- Latest legacy parameters (AV_ATACSEQ_2026 Scripts/config.py and step scripts) ----------------------------
# Trimming (step_1_trimmomatic.py): Trimmomatic 0.32 jar (pipeline: biocontainer 0.40), PE; ILLUMINACLIP:NexteraPE-PE.fa:2:30:10:8:True
#   LEADING:3 TRAILING:3 SLIDINGWINDOW:4:20 MINLEN:25.
# Alignment: bowtie2 --local --very-sensitive-local -q --no-mixed --no-discordant --dovetail -I 10 -X 2000. Here: CUT&RUN parameters + -X 2000; -N 1 dropped (user, 2026-10-28); legacy toggles below.
# BAM filter (step_3_process_bam.py): samtools view -f 1 -f 2 -F 4 -F 8 -F 256 -F 512 -F 1024 -F 2048 with the LITERAL -q mapq (= 0);
#   no chrM removal. Duplicates: sambamba markdup -r (REMOVE_DUPLICATES True).
# Blacklist (step_3_process_bam.py): BAM -> BEDPE -> bedtools intersect -v -> BEDPE -> BAM (replaced by a pair-aware filter here).
# TMM (step_4b_tmm_normalization.py, scaleFactors.R): bin 10000 bp, EFFICIENCY_BIAS FALSE, groups by file-name substring
#   (TARGETS BT54,BT88,TS603,TS667,11284,11656,6349,x42c,x6c,K27M); max.frag from getPEsizes.R (legacy value 1999, see README).
# bigWig (step_5_generate_bigwig.py): bamCoverage --binSize 10 --skipNonCoveredRegions --centerReads; TMM tracks with no
#   --normalizeUsing (None) and --scaleFactor 1/SF, SF = normalisation factor * library size / 1e6; no --extendReads.
# MACS3 (step_4c_macs2.py): callpeak -f BAMPE --keep-dup all -q 0.05 --min-length 250 --max-gap 500 --fe-cutoff 2.0
#   -g 3100000000.0 (narrow, no summits), replicates pooled, no control.
# Peak merge (merge_peaks.sh): bedops --merge of the *high / *low narrowPeak files with fe4.0 (see peak_merges.csv).
# TSS (config.py:75): legacy path .../mylibrary/genomes/t2t.curated.norandom.tss.bed lacks t2t/ and does not exist; corrected below.
#
# The value on each line is the setting this example uses: the latest legacy value, or the pipeline default where the
# pipeline deliberately differs from legacy (MAPQ, chrM, TMM groups, Tn5). A comment after a key gives the legacy value and
# the toggle that reproduces it.
project_name: my_atacseq      # set me (prefix of the QC report and other project-level outputs)
samplesheet: samplesheet.csv
peak_merges: peak_merges.csv   # legacy merge_peaks.sh (high and low sets); null = no merged BED
fastq_dir: null           # samplesheet carries absolute FASTQ paths
outdir: ./results
metadata_dir: ./metadata
intermediate_dir: ./intermediate_files
publish_mode: copy

genome_index: null   # set me: bowtie2 index PREFIX of the genome (required). Legacy GNM_IDX: .../mylibrary/bowtie2/t2t/chm13v2.0 (CHM13v2.0)
chrom_sizes: null   # set me (recorded and validated only if set). Legacy GNM_SIZES: .../mylibrary/chr_size/t2t.chrom.sizes
blacklist: null   # set me (null or empty = skip BLACKLIST_FILTER). Legacy BLACKLIST: .../mylibrary/blacklist/t2t.blacklist.bed; pair-aware removal here (no BED round trip)
gtf: null   # set me (recorded and validated only if set). Legacy GNM_GTF: .../mylibrary/genomes/t2t/t2t.ncbiRefSeq.curated.norandom.gtf
tss_bed: null   # set me (required when run_tss_enrichment is on and some sample has a tmm_group). Legacy config.py:75 path missing t2t/ (does not exist); corrected
effective_genome_size: null   # set me (MACS3 -g; required when run_macs3 is on and some sample has a peak_group). Legacy GENOME_SIZE_FOR_MACS 3.1e9 (t2t)
contamination_index: null   # set me or leave null (null = skip CONTAMINATION). Legacy CONTAMINANTS_IDX (merged contaminant genomes)

run_fastqc: true
trim: true                # legacy: Trimmomatic PE
run_tss_enrichment: true
run_macs3: true
run_multiqc: true
tn5_shift: false          # true = deepTools alignmentSieve --ATACshift before QC/TMM/bigWig/MACS3 (not in legacy)
remove_duplicates: true   # legacy REMOVE_DUPLICATES True (sambamba markdup -r)
help: false

trim_adapter_set: 'NexteraPE-PE'
trim_illuminaclip: '2:30:10:8:True'
trim_steps: 'LEADING:3 TRAILING:3 SLIDINGWINDOW:4:20'
trim_minlen: 25           # legacy MINLEN:25

bowtie2_mode: local
bowtie2_minins: 10        # bowtie2 -I. Legacy: null (no -I)
bowtie2_maxins: 2000      # legacy -X 2000
bowtie2_args: ''          # extra bowtie2 arguments. Legacy: '-N 1 -t' (the other legacy flags are fixed in the pipeline)
align_chunk_pairs: 10000000   # read pairs per ALIGN task; 0 = no chunking (one ALIGN task per library)
alignment_min_pct: 20     # warning threshold only (never fails)

mapq: 30                  # 0 reproduces legacy literal `-q mapq` (samtools reads it as 0)
remove_chroms: chrM       # '' (empty) = legacy: keep chrM

tss_flank: 2000           # legacy computeMatrix flank +-2 kb

tmm_bin_size: 10000       # legacy BIN_WIDTH
tmm_max_frag: auto        # legacy max.frag (getPEsizes.R; legacy value 1999 = first sample only, see README); auto = true maximum here
tmm_group_column: tmm_group   # tmm_group_legacy = legacy substring membership (K27M+K27MKO, x42c+HGGx42c)

bigwig_bin_size: 10       # legacy BIN_SIZE
bigwig_units: none        # legacy: no --normalizeUsing (None); --scaleFactor 1/SF
bigwig_extend_reads: true    # fragment coverage (as CUT&RUN); legacy false: no --extendReads = per-mate read coverage
bigwig_center_reads: false   # legacy true, but --centerReads was a no-op without --extendReads; true + extend true =
                             #   read-length windows at fragment midpoints (neither legacy nor fragment coverage)
bigwig_args: ''

macs3_qvalue: 0.05        # legacy MACS_Q_VALUE
macs3_min_length: 250     # legacy MACS_MIN_LENGTH
macs3_max_gap: 500        # legacy MACS_MAX_GAP
macs3_fe_cutoff: 2.0      # legacy config.py 2.0 (fe2.0 narrowPeak files); legacy merge_peaks.sh used the fe4.0 files, which also exist in peaks/ (4.0 = alternative)
macs3_call_summits: false
macs3_broad: false
macs3_broad_cutoff: 0.1
macs3_args: ''

# ---- Downstream analyses (off by default; README section "Downstream analyses") -----------------------------
# Uncomment a key to use it. Each line gives the pipeline default and, after "legacy", the older AV / AM value.
# run_differential: false          # DIFF_ACCESS per comparison (needs comparisons.csv). AV example: true
# run_annotation: false            # DIFF_ANNOTATE per comparison (needs gtf and a peaks table). AV example: true
# run_motifs: false                # MOTIF_ENRICHMENT per comparison and motif region, MOTIF_COMMON. AV example: true
# comparisons: null                # comparisons.csv (name,case,control,group_column,block_column,case_peaks,control_peaks,pooled,fixed_dispersion); AV example: comparisons.csv
# peak_files: null                 # peak_files.csv (name,path): existing peak files usable as peak groups
# diff_tables: null                # diff_tables.csv (name,regions,path): existing differential tables, not computed
# motif_targets: null              # motif_targets.csv (name,type,target,comparison,label,min_peaks): target vs other (legacy ST8SIA1)
# species: 'Homo sapiens'          # Homo sapiens | Mus musculus. AM legacy: 'Mus musculus'
# genome_build: 'hs1'              # build of the BAMs and the GTF. AM legacy: mm39
# bsgenome: null                   # BSgenome package (chromosome lengths); null = BSgenome.Hsapiens.UCSC.<genome_build> (Mmusculus for Mus musculus)
# org_db: null                     # annotation package; null = org.Hs.eg.db (org.Mm.eg.db for Mus musculus)
# diff_regions: 'peaks'            # peaks | peaks,promoters. AV example: peaks,promoters (promoters need gtf)
# diff_minq: 10                    # csaw minq (minimum mapping quality)
# diff_pe: 'both'                  # both | none. older AV / AM: none
# diff_max_frag: 500               # csaw max.frag (csaw default; the legacy never set it)
# diff_dedup: null                 # null = remove_duplicates true ? 'false' : 'true'; true | false | auto (auto = legacy rule: TRUE when a comparison has <= 2 BAMs)
# diff_bin_size: 10000             # csaw window width for the normalisation factors (bp)
# diff_lfc: 0.585                  # |logFC| for the up/down BEDs and printed counts. older AV / AM: 1
# diff_fdr: 0.1                    # FDR for the printed counts only
# diff_table: 'best'               # best (merged$best) | combined (merged$combined). AM legacy: combined
# diff_qlf_min_libs: 3             # quasi-likelihood F-test when a comparison has >= this many libraries, else fixed dispersion + LRT
# diff_fixed_dispersion: 0.05      # LRT dispersion. legacy gd2 chunk: 0.15 (set fixed_dispersion per comparison in comparisons.csv)
# diff_promoter_up: 2000           # promoter window upstream of the TSS (bp)
# diff_promoter_down: 200          # promoter window downstream of the TSS (bp)
# diff_promoter_min_fc: 4          # promoters kept when background abundance > log2(this)
# diff_cpus: 4                     # BiocParallel workers for the read counting
# annotation_tss_region: '-2000,200'   # ChIPseeker tssRegion (upstream,downstream bp)
# annotation_fdr: null             # null = annotate all regions (AV). older AV: 0.1 (FDR filter before annotating)
# motif_regions: 'promoters'       # promoters | peaks | all_sites | promoter_sites | non-promoter_sites | distal_sites (comma list). AM legacy: promoter_sites,non-promoter_sites,all_sites
# motif_lfc: 0.585                 # bins at |logFC| > this. older AV / AM: 1
# motif_min_score: 10              # PWM hit threshold (min.score)
# motif_test: 'binomial'           # test of calcBinnedMotifEnrR
# motif_max_kmer: 3                # composition correction (maxKmerSize)
# motif_background: 'otherBins'    # background of calcBinnedMotifEnrR
# motif_seed: 123                  # RNGseed (serial run)
# motif_top: 40                    # motifs in the heatmaps when more than this pass
# motif_padj_primary: 2.0          # -log10 adjusted P, primary selection (legacy padj < 0.01)
# motif_padj_relaxed: 1.0          # -log10 adjusted P, relaxed selection (legacy padj < 0.1)
# motif_min_bin_peaks: 10          # diff mode: skip when a bin has fewer regions
# motif_target_min_peaks: 15       # target mode: default minimum regions (a CSV min_peaks overrides)
# motif_pwm_rds: null              # cached PWMList (legacy rds/pwms.rds); null = JASPAR2024 from the package
# motif_gene_column: 'geneId'      # annotation column searched by a gene target
# motif_match: 'exact'   # exact (whole symbol = nearest gene) | substring (legacy grepl; FOS also matches FOSB)
# motif_cpus: 1                    # 1 = serial RNGseed run (legacy result); >1 not bit-reproducible
# motif_common_padj: 0.10          # MOTIF_COMMON: significant in a comparison at this adjusted P
# motif_common_min_lines: 2        # MOTIF_COMMON: common when significant in at least this many comparisons
# motif_common_label_strip: null   # regex removed from the comparison names for the labels. AV example: '_high_vs_low.*'
# plot_font: 'Helvetica'           # font family of every plot
# plot_format: 'svg'               # svg | pdf (legacy)
