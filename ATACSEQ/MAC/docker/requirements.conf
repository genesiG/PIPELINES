# What this pipeline needs from a personal computer. Read by run_atacseq
# before every run: if the run's budget (what the computer can give it) is
# below min_memory_gb, it stops at once with a plain explanation instead of
# failing halfway through. Includes about 1 GB for Nextflow itself.
#
# Peaks from the cluster measurements (not re-measured locally): ALIGN 3.9 GB (the cluster 1M-pair run of
# 2026-10-29; the bowtie2 index, loaded by each chunk; ALIGN is requested at 4.5 GB) and BAM_FILTER 5.0 GB
# (conf/base.config); the other measured steps peak lower.
# 5 GB = ALIGN's measured peak (3.9 GB) plus the 1 GB kept for Nextflow, rounded up, as in the CUT&RUN port.
# BAM_FILTER (peak 5.0 GB) is capped to the budget on a 5 GB computer, so it runs at the edge of its memory there.
min_memory_gb=5
# The most memory this pipeline can put to use: runs are capped here (unless
# config.yaml sets max_memory_gb). More memory lets more steps run side by side
# (each step asks only for what it needs, conf/docker_tiers.config) and absorbs
# a retry with more memory; it does not make a single step faster.
max_useful_memory_gb=14
# Below this the run still works, just slowly; the launcher only warns.
min_cpus=2
# Disk space. The run writes intermediate and result files that grow with the
# input, so the launcher checks the drives before a run:
# - with work_volume: false (the work folder is in the project folder) it warns
#   when the free space on the project drive is below disk_factor times the total
#   size of the FASTQ files named in the samplesheet;
# - with work_volume: true (the work folder is Docker's volume) it warns when the
#   free space on the project drive is below disk_results_factor times that total
#   (the results), and when Docker's disk is below the work part, disk_factor
#   minus disk_results_factor times that total;
# - it stops before the run when the free space on the project drive is below
#   disk_hard_min_gb.
# Measured 2026-10-31 (atac_av_6349: two full-depth libraries, 11.4 GB of FASTQ): results 4.2 GB (0.4 x the input); the Docker work
# volume held 55 GB at the end (4.8 x), counting leftovers of aborted attempts of that run. 5.2 = 4.8 + 0.4. Other datasets may differ.
disk_factor=5.2
# Results only (the part that stays on the project drive when the work folder is
# Docker's volume). Measured 0.4 x the input.
disk_results_factor=0.4
disk_hard_min_gb=20
