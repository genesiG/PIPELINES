name: omics-image

# Builds, smoke-tests and publishes ghcr.io/genesig/omics:<docker/omics/VERSION>.
# A VERSION tag is immutable: the job fails if that tag already exists. To release,
# bump docker/omics/VERSION and merge to main.
on:
  push:
    branches: [main]
    paths:
      - "docker/omics/**"
      - ".github/workflows/omics-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: omics-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/genesig/omics

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        # The final image is ~15-20 GB; building plus smoke test plus push needs ~45 GB free.
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check free disk space
        run: |
          df -h / /mnt
          avail="$(df --output=avail -BG / | tail -1 | tr -dc 0-9)"
          if [ "${avail}" -lt 45 ]; then
            echo "::error::only ${avail} GB free on /; need at least 45 GB to build, test and push the image."
            exit 1
          fi

      - name: Read version
        run: |
          version="$(tr -d '[:space:]' < docker/omics/VERSION)"
          [ -n "${version}" ] || { echo "docker/omics/VERSION is empty" >&2; exit 1; }
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if this version is already published
        run: |
          rc=0
          out="$(docker manifest inspect "${IMAGE}:${VERSION}" 2>&1)" || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::${IMAGE}:${VERSION} already exists; VERSION tags are immutable. Bump docker/omics/VERSION."
            exit 1
          fi
          if printf '%s' "${out}" | grep -qiE 'no such manifest|manifest unknown|name unknown|not found'; then
            echo "${IMAGE}:${VERSION} does not exist yet: OK to publish."
          else
            echo "::error::could not tell whether ${IMAGE}:${VERSION} exists:"
            printf '%s\n' "${out}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # The docker driver builds straight into the local image store, so the ~20 GB image
        # is not stored twice (BuildKit cache volume plus loaded image). No cache export is used.
        with:
          driver: docker

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/omics
          platforms: linux/amd64
          build-args: |
            OMICS_VERSION=${{ env.VERSION }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}

      - name: Smoke test
        run: docker run --rm --platform linux/amd64 "${IMAGE}:${VERSION}" /opt/omics/smoke_test.sh

      - name: Disk usage before push
        run: df -h /

      - name: Push
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"
