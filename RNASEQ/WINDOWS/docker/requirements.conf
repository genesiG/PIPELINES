# What this pipeline needs from a personal computer. Read by run_rnaseq
# before every run: if the run's budget (what the computer can give it) is
# below min_memory_gb, it stops at once with a plain explanation instead of
# failing halfway through. Includes about 1 GB for Nextflow itself.
#
# Measured on the RNA-seq benchmarks (peak_rss of the traces): the full benchmark (12 libraries, 56 GB of FASTQ,
# execution_trace_20261029_114629.txt) peaks at ALIGN 13.7 GB RSS (hisat2 about 5.7 GB plus 1 GB sort buffers per thread
# at 8 threads), MARK_DUPLICATES 12.5 GB (at its heap ceiling), TRIM 6.2 GB (at its heap ceiling), and every
# other step at or below 4.5 GB; the subsample (1M pairs, benchmark/sub) peaks at ALIGN 5.4 GB, MARK_DUPLICATES 5.3 GB,
# TRIM 4.1 GB. conf/docker_tiers.config requests ALIGN 10.5 GB (hisat2 5.7 GB plus samtools sort -m 512M x 8 threads = 4 GB),
# MARK_DUPLICATES 8 GB, TRIM 3 GB and BAM_FILTER 5.6 GB; a step whose request is larger than the budget is capped to the
# budget (resourceLimits).
# min_memory_gb = 8: a budget of 8 GB runs the small and medium data (the 1M-pair benchmark: ALIGN peak 5.4 GB plus
# 1 GB kept for Nextflow, with margin). It does NOT run full-depth libraries well: their ALIGN needs about 10 GB
# (hisat2 5.7 + sort buffers 4 + the rest), so on 8 GB ALIGN is capped to 8 GB and may be killed. Full-depth libraries
# need a budget of about 11 GB or more.
min_memory_gb=8
# The most memory this pipeline can put to use: runs are capped here (unless
# config.yaml sets max_memory_gb). 24 GB = two ALIGN tasks side by side (10.5 GB each, 21 GB) with 1 GB for Nextflow
# and about 2 GB for the small steps.
# More memory lets more steps run side by side and absorbs a retry with more memory; it does not make
# a single step faster.
max_useful_memory_gb=24
# Below this the run still works, just slowly; the launcher only warns.
min_cpus=2
# Disk space. The run writes intermediate and result files that grow with the
# input, so the launcher checks the drives before a run:
# - with work_volume: false (the work folder is in the project folder) it warns
#   when the free space on the project drive is below disk_factor times the total
#   size of the FASTQ files named in the samplesheet;
# - with work_volume: true (the work folder is Docker's volume) it warns when the
#   free space on the project drive is below disk_results_factor times that total
#   (the results), and when Docker's disk is below the work part, disk_factor
#   minus disk_results_factor times that total;
# - it stops before the run when the free space on the project drive is below
#   disk_hard_min_gb.
# Both factors are an ESTIMATE, not measured: the benchmark folder holds the FASTQ
# (56.4 GB), the QC and counts (about 0.4 GB) and not the BAMs (about 32 GB, the final
# marked BAMs, not shipped), and no work folder was kept. The estimate: the work folder
# holds the trimmed FASTQ (about 0.95 x the input) and the aligned, filtered and marked
# BAMs (about 0.6, 0.6 and 0.57 x the input), about 2.7 x; the results hold the final
# BAMs, about 0.6 x. Total about 3.3 x, so disk_factor 3.5. Replace with the measured
# sizes after the next full run (du of the work folder and of results/).
disk_factor=3.5
# Results only (the part that stays on the project drive when the work folder is
# Docker's volume): the final BAMs, about 0.6 x the input (estimate, see above).
disk_results_factor=0.6
disk_hard_min_gb=20
