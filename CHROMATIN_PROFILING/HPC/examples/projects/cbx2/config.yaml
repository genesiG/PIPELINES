# Example config for GG_EPICYPHER_CBX2_example (legacy project GG_EPICYPHER_CBX2); flat key: value, read by run_pipeline.sh.
# Reference paths are taken from GG_EPICYPHER_CBX2/Scripts/config.py (SPECIES = t2t_ecoli).
#
# ---- Latest legacy parameters (2026-10-26) ----------------------------------------
# Round 11 (2026-10-15) and later: ChIPseqSpikeInFree (CSIF) RPKM for all tracks, 50 bp bigWigs with extendReads,
# CSIF norm runs in norm_runs.csv (the spike-in table is kept as norm_runs_spikein.csv). csaw TMM over all 10 kb bins
# (legacy callpeaks_csaw.R normFactors(bins)) with max.frag 500; bowtie2 with no -I/-X (manuscript default: bowtie2 -X 500).
# Genome tracks: one y-range per mark from the highest bigWig bin in the locus window (1.05 x, 2 s.f.).
# Heatmaps: auto limits, y label "sf x rpkm".
# Each key whose value differed between legacy runs has its alternatives in a comment next to it.
# ------------------------------------------------------------------------------------
project_name: GG_EPICYPHER_CBX2_example
samplesheet: samplesheet.csv
norm_runs: norm_runs.csv  # alternative: norm_runs_spikein.csv (spike-in table of rounds 9-10, same run names)
peaksets: peaksets.csv
classifications: classifications.csv
heatmaps: heatmaps.csv
tracks: tracks.csv
intersects: intersects.csv
fastq_dir: null           # samplesheet carries absolute FASTQ paths (supported way for these examples)
outdir: ./results
metadata_dir: ./metadata
intermediate_dir: ./intermediate_files
publish_mode: copy

experiment: cutandrun     # config.py EXPERIMENT
genome_index: /path/to/mylibrary/bowtie2/t2t_ecoli/t2t_ecoli          # bowtie2 index PREFIX (T2T-CHM13 + E. coli spike-in)
chrom_sizes: /path/to/mylibrary/chr_size/t2t_ecoli.chrom.sizes
blacklist: /path/to/mylibrary/blacklist/t2t.blacklist.cut.and.run.bed # cutandrun variant
gtf: /path/to/mylibrary/genomes/t2t/t2t.ncbiRefSeq.curated.norandom.gtf
tss_bed: /path/to/mylibrary/genomes/t2t/t2t.curated.norandom.tss.bed
spike_prefix: ecoli_chr
mito_chrom: chrM
effective_genome_size: 3100000000
paired_end: true

trim: true
trim_minlen: 25
bowtie2_mode: local
bowtie2_minins: null  # null = bowtie2 default -I 0
bowtie2_maxins: null  # null = bowtie2 default (-I 0 / -X 500), as in the manuscript; alternative: 10 / 700 (2026-10 test runs)
mapq: 30                  # config.py MAPQ
remove_duplicates: true   # config.py REMOVE_DUPLICATES (cutandrun)
spikein_dedup: true       # config.py SPIKEIN_DEDUP (round 9: target + spike-in dedup)

normalisation: chipseqspikeinfree     # config.py NORMALIZE_USING = CHIPSEQSPIKEINFREE (CBX2 since 2026-10-14); alternative: spikein (spike-in era, with norm_runs_spikein.csv); per-sample norm_run in samplesheet decides
bigwig_bin_size: 50     # config.py BIN_SIZE (50 since 2026-10-15); alternative: 100 (CPM bigWigs, briefly 2026-10-15)
bigwig_extend_reads: true  # bamCoverage --extendReads (fragments), legacy since 2026-10-15
bigwig_units: rpkm      # config.py BIGWIG_UNIT = RPKM (2026-10-15); alternative: cpm (spike-in CPM variant)
run_log2ratio: false
tmm_bin_size: 10000
norm_spikein: false  # TMM, CPM (norm_methods default) are computed as diagnostics next to the primary; true adds spike-in factors

run_csaw: true
run_classify: true        # 1uM vs DMSO classes of two peak sets (classifications.csv)
csaw_window: 150          # csaw_parameters.R width.small
csaw_spacing: 50          # spacing.small
csaw_bin: 10000           # bin.size
csaw_norm_bins: all  # background = pipeline default
csaw_max_frag: 500  # null = bowtie2_maxins
run_csaw_cutoff_scan: false
csaw_scan_small_grid: '1,1.5,2,3'
csaw_scan_large_grid: '0.5,1,1.5,2'

# broad_marks (2026-10-27, lab decision): pipeline default list + H2AK119ub, EZH2, CBX2 (AntiCBX2RP) and GSTCBX2.
# AntiCBX2RP (antibody CBX2) and GSTCBX2 are very different experimental settings: keep them in separate
# antibody, group and norm_run values; never pair them as replicates.
broad_marks: 'H3K27me3,H3K27me2,H3K36me3,H3K4me1,H3K79me2,H3K79me3,H3K9me1,H3K9me2,H3K9me3,H4K20me1,H3F3A,H2AK119ub,EZH2,CBX2,GSTCBX2'
run_macs3: true
macs3_broad: auto  # auto = broad for broad_marks (default list), narrow otherwise; true | false forces every group
macs3_qvalue: 0.01
macs3_broad_cutoff: 0.1
run_seacr: true
seacr_mode: auto  # auto = relaxed for broad_marks, stringent otherwise (SEACR has no broad mode); relaxed | stringent forces every group
seacr_min_replicates: 2
seacr_reciprocal_overlap: 0.5

skip_groups: ""
run_report: true
run_heatmaps: true
heatmap_y_label: 'sf x rpkm'  # legacy round 11 y label; null = normalised <bigwig_units> (pipeline default)
run_tracks: true
tracks_max_value_default: shared  # blank max_value: shared (one group per antibody) | auto (per-track autoscale) | number
tracks_limit_stat: max_bin  # mean_bins = pipeline default (EED rule); max_bin = CBX2 legacy rule (1.05 x highest bigWig bin in the window)
# Peak QC tracks (run_peak_qc, default true): ~8-15 regions chosen automatically from the peak sets and drawn as track set peak_qc (results/tracks/peak_qc/, figures results/tracks/plots/peak_qc.NN_<label>.svg).
# The two keys below are K27-mark (Polycomb) loci; they are only a project choice, other marks would take their own loci.
peak_qc_loci: 'HOXA=HOXA*|HOTTIP|HOTAIRM1:150000,CDKN2A:125000'   # [NAME=]GENE|chr:s-e[:FLANK], comma list; '' = default marker loci
peak_qc_negative: 'GAPDH:100000'   # negative-control locus; auto = chosen from the data, none = no negative
run_annotation: true
# legacy round 9 annotated K27me3 Lost / Retained / Unclassified (class names of the K27me3 classification); empty = off
annotation_extra_beds: 'K27me3_1uM.retained,K27me3_1uM.lost,K27me3_1uM.unclassified'
run_intersect: true
heatmap_seed: 42
