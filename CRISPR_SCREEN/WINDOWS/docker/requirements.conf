# What this pipeline needs from a personal computer. Read by run_crisprscreen
# before every run: if the run's budget (see README.md, "Resources") is below
# min_memory_gb, it stops at once with a plain explanation instead of failing
# halfway through. Includes ~1 GB for Nextflow itself.
#
# CRISPR_SCREEN: every step peaked below 0.9 GB in real full-lane cluster runs
# (conf/base.config) and Nextflow itself takes ~1 GB, so 2.5 GB runs the steps
# one or two at a time (measured on a full lane; to be confirmed by a test run).
# More memory only lets more steps run side by side and absorb the
# retry-with-more-memory of an unusually large step.
min_memory_gb=2.5
# The most memory this pipeline can put to use: runs are capped here (unless
# config.yaml sets max_memory_gb). More would not make it faster: Linux fills
# whatever Docker's VM may use with file cache while it streams the FASTQs, and
# Windows/macOS get that memory back only slowly, so the computer can become
# unresponsive. 8 GB = several steps side by side plus their retries.
max_useful_memory_gb=8
# Below this the run still works, just slowly; the launcher only warns.
min_cpus=2
